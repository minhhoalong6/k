<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Messenger Web App</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts (Inter) -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
        }
        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        ::-webkit-scrollbar-track {
            background: transparent;
        }
        ::-webkit-scrollbar-thumb {
            background: #cbd5e1;
            border-radius: 9999px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #94a3b8;
        }
        .chat-bubble-sender {
            background: linear-gradient(135deg, #0084FF 0%, #00C6FF 100%);
        }
        .chat-bubble-receiver {
            background-color: #f0f2f5;
        }
        .animate-fade-in {
            animation: fadeIn 0.2s ease-out forwards;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(6px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body class="bg-gray-100 text-gray-800 h-screen overflow-hidden flex flex-col">

    <!-- MAIN CONTAINER -->
    <div id="app" class="h-full w-full flex flex-col relative">

        <!-- ERROR / NOTIFICATION TOAST -->
        <div id="toast-alert" class="hidden fixed top-4 right-4 z-50 bg-amber-500 text-white px-4 py-3 rounded-xl shadow-lg flex items-center space-x-2 text-sm animate-fade-in max-w-sm">
            <i class="fa-solid fa-circle-info"></i>
            <span id="toast-msg">Thông báo hệ thống.</span>
            <button onclick="document.getElementById('toast-alert').classList.add('hidden')" class="ml-auto text-white hover:opacity-75">
                <i class="fa-solid fa-xmark"></i>
            </button>
        </div>

        <!-- 1. SCREEN: LOGIN / ENTER NAME (Hiển thị ngay khi vào ứng dụng) -->
        <div id="login-screen" class="fixed inset-0 bg-gray-900/60 backdrop-blur-sm z-40 flex items-center justify-center p-4">
            <div class="bg-white rounded-3xl shadow-2xl max-w-md w-full p-8 animate-fade-in text-center border border-gray-100">
                
                <div class="w-20 h-20 bg-gradient-to-tr from-blue-600 to-cyan-400 rounded-full flex items-center justify-center mx-auto mb-5 shadow-lg shadow-blue-500/30">
                    <i class="fa-brands fa-facebook-messenger text-4xl text-white"></i>
                </div>

                <h2 class="text-2xl font-bold text-gray-800 mb-2">Đăng Nhập Messenger</h2>
                <p class="text-sm text-gray-500 mb-6">Nhập tên của bạn để tham gia phòng chat cùng mọi người.</p>

                <form id="login-form" class="space-y-5">
                    <div class="text-left">
                        <label class="block text-xs font-semibold text-gray-500 uppercase tracking-wider mb-1 ml-1">Tên hiển thị của bạn</label>
                        <div class="relative">
                            <i class="fa-solid fa-user absolute left-4 top-1/2 -translate-y-1/2 text-gray-400"></i>
                            <input type="text" id="username-input" required maxlength="30" autofocus
                                class="w-full pl-11 pr-4 py-3 bg-gray-50 border border-gray-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-blue-500 focus:bg-white transition text-gray-800 font-medium placeholder-gray-400 text-base" 
                                placeholder="VD: Hoàng Nam, Tuấn Anh...">
                        </div>
                    </div>

                    <!-- Chọn Màu Avatar -->
                    <div>
                        <label class="block text-xs font-semibold text-gray-500 uppercase tracking-wider mb-2 text-left ml-1">Chọn màu đại diện:</label>
                        <div class="flex justify-between items-center px-1" id="avatar-color-picker">
                            <button type="button" data-color="from-blue-500 to-cyan-400" class="color-btn w-9 h-9 rounded-full bg-gradient-to-tr from-blue-500 to-cyan-400 ring-2 ring-offset-2 ring-blue-500 transition-transform transform hover:scale-110"></button>
                            <button type="button" data-color="from-purple-500 to-pink-500" class="color-btn w-9 h-9 rounded-full bg-gradient-to-tr from-purple-500 to-pink-500 transition-transform transform hover:scale-110"></button>
                            <button type="button" data-color="from-emerald-400 to-teal-600" class="color-btn w-9 h-9 rounded-full bg-gradient-to-tr from-emerald-400 to-teal-600 transition-transform transform hover:scale-110"></button>
                            <button type="button" data-color="from-orange-400 to-amber-500" class="color-btn w-9 h-9 rounded-full bg-gradient-to-tr from-orange-400 to-amber-500 transition-transform transform hover:scale-110"></button>
                            <button type="button" data-color="from-rose-500 to-red-600" class="color-btn w-9 h-9 rounded-full bg-gradient-to-tr from-rose-500 to-red-600 transition-transform transform hover:scale-110"></button>
                            <button type="button" data-color="from-indigo-600 to-violet-600" class="color-btn w-9 h-9 rounded-full bg-gradient-to-tr from-indigo-600 to-violet-600 transition-transform transform hover:scale-110"></button>
                        </div>
                    </div>

                    <button type="submit" id="submit-login-btn"
                        class="w-full py-3.5 bg-gradient-to-r from-blue-600 to-cyan-500 text-white font-semibold text-base rounded-xl shadow-lg shadow-blue-500/30 hover:shadow-blue-500/50 hover:opacity-95 active:scale-[0.98] transition">
                        Bắt đầu nhắn tin <i class="fa-solid fa-arrow-right ml-2 text-sm"></i>
                    </button>
                </form>

            </div>
        </div>

        <!-- 2. SCREEN: MAIN MESSENGER UI -->
        <div id="main-chat" class="hidden h-full w-full flex bg-white">
            
            <!-- LEFT SIDEBAR -->
            <div id="sidebar" class="w-full md:w-80 lg:w-96 flex-shrink-0 bg-white border-r border-gray-200 flex flex-col h-full transition-all duration-300">
                <!-- User Header -->
                <div class="p-4 border-b border-gray-100 flex items-center justify-between">
                    <div class="flex items-center space-x-3">
                        <div id="current-user-avatar" class="w-10 h-10 rounded-full bg-gradient-to-tr from-blue-500 to-cyan-400 text-white flex items-center justify-center font-bold text-base shadow">
                            U
                        </div>
                        <div>
                            <h3 id="current-user-name" class="font-bold text-gray-900 text-base leading-tight">...</h3>
                            <span class="inline-flex items-center text-xs text-emerald-500 font-medium">
                                <span class="w-2 h-2 bg-emerald-500 rounded-full mr-1.5 animate-pulse"></span> Đang hoạt động
                            </span>
                        </div>
                    </div>
                    <button id="logout-btn" title="Đổi tên / Đăng xuất" class="w-9 h-9 rounded-full hover:bg-gray-100 text-gray-500 hover:text-red-500 flex items-center justify-center transition">
                        <i class="fa-solid fa-right-from-bracket"></i>
                    </button>
                </div>

                <!-- Search -->
                <div class="p-3">
                    <div class="relative">
                        <i class="fa-solid fa-magnifying-glass absolute left-3.5 top-1/2 -translate-y-1/2 text-gray-400 text-sm"></i>
                        <input type="text" id="search-users" placeholder="Tìm kiếm trên Messenger..." 
                            class="w-full pl-9 pr-4 py-2 bg-gray-100 border-none rounded-full text-sm focus:outline-none focus:ring-2 focus:ring-blue-500/40 text-gray-700">
                    </div>
                </div>

                <!-- Chat Channels & Users List -->
                <div class="flex-1 overflow-y-auto px-2 space-y-1">
                    
                    <!-- Global Lounge Channel -->
                    <div id="channel-global" data-chat-id="global" class="chat-target-item flex items-center space-x-3 p-3 rounded-xl cursor-pointer transition bg-blue-50 text-blue-600">
                        <div class="relative">
                            <div class="w-12 h-12 rounded-full bg-gradient-to-tr from-blue-600 to-cyan-400 text-white flex items-center justify-center text-xl shadow">
                                <i class="fa-solid fa-users"></i>
                            </div>
                        </div>
                        <div class="flex-1 min-w-0">
                            <div class="flex justify-between items-baseline mb-0.5">
                                <h4 class="font-semibold text-gray-900 text-sm truncate">Phòng Chat Chung</h4>
                                <span class="text-[11px] text-gray-400">Tất cả</span>
                            </div>
                            <p class="text-xs text-gray-500 truncate">Kênh nhắn tin công khai</p>
                        </div>
                    </div>

                    <!-- Divider -->
                    <div class="pt-3 pb-1 px-3">
                        <span class="text-xs font-bold text-gray-400 uppercase tracking-wider">Thành viên trực tuyến</span>
                    </div>

                    <!-- Dynamic Online Users -->
                    <div id="dynamic-users-list" class="space-y-1">
                        <!-- Rendered by JS -->
                    </div>

                </div>
            </div>

            <!-- RIGHT CHAT AREA -->
            <div id="chat-area" class="hidden md:flex flex-1 flex-col h-full bg-gray-50 relative">
                
                <!-- Chat Header -->
                <div class="h-16 px-4 bg-white border-b border-gray-200 flex items-center justify-between shadow-sm z-10">
                    <div class="flex items-center space-x-3">
                        <button id="back-to-list-btn" class="md:hidden w-8 h-8 rounded-full text-gray-600 hover:bg-gray-100 flex items-center justify-center mr-1">
                            <i class="fa-solid fa-arrow-left"></i>
                        </button>
                        
                        <div id="chat-header-avatar" class="w-10 h-10 rounded-full bg-gradient-to-tr from-blue-600 to-cyan-400 text-white flex items-center justify-center font-bold shadow">
                            <i class="fa-solid fa-users"></i>
                        </div>
                        <div>
                            <h3 id="chat-header-title" class="font-bold text-gray-900 text-sm md:text-base leading-tight">Phòng Chat Chung</h3>
                            <p id="chat-header-status" class="text-xs text-gray-500">Kênh nhắn tin công khai</p>
                        </div>
                    </div>

                    <div class="flex items-center space-x-1 text-blue-600">
                        <button class="w-9 h-9 rounded-full hover:bg-gray-100 flex items-center justify-center transition" title="Cuộc gọi thoại">
                            <i class="fa-solid fa-phone text-base"></i>
                        </button>
                        <button class="w-9 h-9 rounded-full hover:bg-gray-100 flex items-center justify-center transition" title="Cuộc gọi video">
                            <i class="fa-solid fa-video text-base"></i>
                        </button>
                        <button class="w-9 h-9 rounded-full hover:bg-gray-100 flex items-center justify-center transition" title="Thông tin">
                            <i class="fa-solid fa-circle-info text-base"></i>
                        </button>
                    </div>
                </div>

                <!-- Messages Feed -->
                <div id="messages-container" class="flex-1 overflow-y-auto p-4 space-y-3">
                    <!-- Messages rendered by JS -->
                </div>

                <!-- Emoji Bar Quick Select -->
                <div id="emoji-picker" class="hidden absolute bottom-20 left-4 bg-white shadow-2xl rounded-2xl border border-gray-200 p-3 grid grid-cols-6 gap-2 z-20 animate-fade-in">
                    <button class="emoji-btn text-2xl hover:scale-125 transition">👍</button>
                    <button class="emoji-btn text-2xl hover:scale-125 transition">❤️</button>
                    <button class="emoji-btn text-2xl hover:scale-125 transition">😂</button>
                    <button class="emoji-btn text-2xl hover:scale-125 transition">😮</button>
                    <button class="emoji-btn text-2xl hover:scale-125 transition">😢</button>
                    <button class="emoji-btn text-2xl hover:scale-125 transition">🔥</button>
                    <button class="emoji-btn text-2xl hover:scale-125 transition">🎉</button>
                    <button class="emoji-btn text-2xl hover:scale-125 transition">👏</button>
                    <button class="emoji-btn text-2xl hover:scale-125 transition">😍</button>
                    <button class="emoji-btn text-2xl hover:scale-125 transition">🙏</button>
                    <button class="emoji-btn text-2xl hover:scale-125 transition">💯</button>
                    <button class="emoji-btn text-2xl hover:scale-125 transition">✨</button>
                </div>

                <!-- Input Box -->
                <div class="p-3 bg-white border-t border-gray-200 flex items-center space-x-2">
                    <button id="toggle-emoji" class="w-9 h-9 rounded-full text-blue-600 hover:bg-gray-100 flex items-center justify-center transition flex-shrink-0">
                        <i class="fa-solid fa-face-smile text-xl"></i>
                    </button>

                    <form id="message-form" class="flex-1 flex items-center space-x-2">
                        <div class="relative flex-1">
                            <input type="text" id="message-input" autocomplete="off"
                                placeholder="Nhập tin nhắn..." 
                                class="w-full py-2.5 px-4 bg-gray-100 border-none rounded-full text-sm text-gray-800 focus:outline-none focus:ring-2 focus:ring-blue-500/50">
                        </div>
                        
                        <button type="submit" id="send-btn" 
                            class="w-10 h-10 rounded-full bg-blue-600 hover:bg-blue-700 text-white flex items-center justify-center shadow-md transition flex-shrink-0">
                            <i id="send-icon" class="fa-solid fa-thumbs-up text-lg"></i>
                        </button>
                    </form>
                </div>

            </div>

        </div>

    </div>

    <!-- Firebase SDK Imports -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously, signInWithCustomToken, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, doc, setDoc, collection, addDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        // Global Variables
        const appId = typeof __app_id !== 'undefined' ? __app_id : 'messenger-clone-app';
        let db = null;
        let auth = null;
        let currentUser = null;
        let isFirebaseActive = false;

        // User profile & State
        let myProfile = {
            id: localStorage.getItem('msg_user_id') || 'user_' + Math.random().toString(36).substring(2, 9),
            name: localStorage.getItem('msg_user_name') || '',
            avatarColor: localStorage.getItem('msg_user_color') || 'from-blue-500 to-cyan-400'
        };

        // Save generated ID
        localStorage.setItem('msg_user_id', myProfile.id);

        let selectedAvatarColor = myProfile.avatarColor;
        let activeChatId = 'global';
        let allUsers = [];
        let allMessages = [];

        // DOM Elements
        const loginScreen = document.getElementById('login-screen');
        const mainChat = document.getElementById('main-chat');
        const loginForm = document.getElementById('login-form');
        const usernameInput = document.getElementById('username-input');
        const toastAlert = document.getElementById('toast-alert');
        const toastMsg = document.getElementById('toast-msg');
        
        const currentUserName = document.getElementById('current-user-name');
        const currentUserAvatar = document.getElementById('current-user-avatar');
        const dynamicUsersList = document.getElementById('dynamic-users-list');
        const messagesContainer = document.getElementById('messages-container');
        const messageForm = document.getElementById('message-form');
        const messageInput = document.getElementById('message-input');
        const sendIcon = document.getElementById('send-icon');
        const logoutBtn = document.getElementById('logout-btn');
        const searchInput = document.getElementById('search-users');
        const sidebar = document.getElementById('sidebar');
        const chatArea = document.getElementById('chat-area');
        const backToListBtn = document.getElementById('back-to-list-btn');
        const toggleEmojiBtn = document.getElementById('toggle-emoji');
        const emojiPicker = document.getElementById('emoji-picker');
        const chatHeaderTitle = document.getElementById('chat-header-title');
        const chatHeaderStatus = document.getElementById('chat-header-status');
        const chatHeaderAvatar = document.getElementById('chat-header-avatar');

        // Notification Toast
        function showToast(msg) {
            if (toastAlert && toastMsg) {
                toastMsg.innerText = msg;
                toastAlert.classList.remove('hidden');
                setTimeout(() => toastAlert.classList.add('hidden'), 4000);
            }
        }

        // Initialize Firebase safely in background
        async function initFirebase() {
            try {
                if (typeof __firebase_config !== 'undefined') {
                    const firebaseConfig = JSON.parse(__firebase_config);
                    const app = initializeApp(firebaseConfig);
                    auth = getAuth(app);
                    db = getFirestore(app);

                    onAuthStateChanged(auth, async (user) => {
                        if (user) {
                            currentUser = user;
                            myProfile.id = user.uid;
                        }
                        isFirebaseActive = true;
                        if (myProfile.name) {
                            syncProfileToFirebase();
                            startRealtimeListeners();
                        }
                    });

                    if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
                        await signInWithCustomToken(auth, __initial_auth_token);
                    } else {
                        await signInAnonymously(auth);
                    }
                }
            } catch (err) {
                console.warn("Chạy ở chế độ kết nối nội bộ:", err);
            }
        }

        // Start Firebase Auth in background
        initFirebase();

        // Auto restore logged-in user if saved
        if (myProfile.name) {
            usernameInput.value = myProfile.name;
            enterMainAppUI();
        }

        // Color selection handling
        document.querySelectorAll('.color-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                document.querySelectorAll('.color-btn').forEach(b => b.classList.remove('ring-2', 'ring-offset-2', 'ring-blue-500'));
                btn.classList.add('ring-2', 'ring-offset-2', 'ring-blue-500');
                selectedAvatarColor = btn.getAttribute('data-color');
            });
        });

        // Submit Name / Login Form
        loginForm.addEventListener('submit', (e) => {
            e.preventDefault();
            const name = usernameInput.value.trim();
            if (!name) return;

            myProfile.name = name;
            myProfile.avatarColor = selectedAvatarColor;

            localStorage.setItem('msg_user_name', name);
            localStorage.setItem('msg_user_color', selectedAvatarColor);

            // IMMEDIATE TRANSITION TO MESSENGER
            enterMainAppUI();

            // Sync background profile
            syncProfileToFirebase();
        });

        function enterMainAppUI() {
            loginScreen.classList.add('hidden');
            mainChat.classList.remove('hidden');

            currentUserName.innerText = myProfile.name;
            currentUserAvatar.className = `w-10 h-10 rounded-full bg-gradient-to-tr ${myProfile.avatarColor} text-white flex items-center justify-center font-bold text-base shadow`;
            currentUserAvatar.innerText = getInitials(myProfile.name);

            startRealtimeListeners();
        }

        async function syncProfileToFirebase() {
            if (db && myProfile.id && myProfile.name) {
                try {
                    const userDocRef = doc(db, 'artifacts', appId, 'public', 'data', 'users', myProfile.id);
                    await setDoc(userDocRef, {
                        uid: myProfile.id,
                        displayName: myProfile.name,
                        avatarColor: myProfile.avatarColor,
                        status: 'online',
                        lastSeen: Date.now()
                    }, { merge: true });
                } catch (e) {
                    console.warn("Lỗi lưu profile:", e);
                }
            }
        }

        // Listeners for Firestore Realtime Data
        function startRealtimeListeners() {
            if (!db) return;

            // Listen Users
            try {
                const usersCol = collection(db, 'artifacts', appId, 'public', 'data', 'users');
                onSnapshot(usersCol, (snapshot) => {
                    allUsers = [];
                    snapshot.forEach(docSnap => {
                        const data = docSnap.data();
                        if (data.uid !== myProfile.id) {
                            allUsers.push(data);
                        }
                    });
                    renderUsersList();
                }, (err) => console.warn("Lỗi tải người dùng:", err));
            } catch (e) {}

            // Listen Messages
            try {
                const msgCol = collection(db, 'artifacts', appId, 'public', 'data', 'messages');
                onSnapshot(msgCol, (snapshot) => {
                    allMessages = [];
                    snapshot.forEach(docSnap => {
                        allMessages.push({ id: docSnap.id, ...docSnap.data() });
                    });
                    // Sort in memory by timestamp
                    allMessages.sort((a, b) => (a.timestamp || 0) - (b.timestamp || 0));
                    renderMessagesFeed();
                }, (err) => console.warn("Lỗi tải tin nhắn:", err));
            } catch (e) {}
        }

        // Helper Initials
        function getInitials(name) {
            if (!name) return 'U';
            const parts = name.trim().split(' ');
            if (parts.length >= 2) {
                return (parts[0][0] + parts[parts.length - 1][0]).toUpperCase();
            }
            return name.slice(0, 2).toUpperCase();
        }

        // Render Users List
        function renderUsersList() {
            const queryText = searchInput.value.toLowerCase().trim();
            const filtered = allUsers.filter(u => u.displayName && u.displayName.toLowerCase().includes(queryText));

            dynamicUsersList.innerHTML = '';

            filtered.forEach(user => {
                const isSelected = activeChatId === user.uid;
                const userEl = document.createElement('div');
                userEl.className = `chat-target-item flex items-center space-x-3 p-3 rounded-xl cursor-pointer transition ${isSelected ? 'bg-blue-50 text-blue-600' : 'hover:bg-gray-100 text-gray-700'}`;

                userEl.innerHTML = `
                    <div class="relative flex-shrink-0">
                        <div class="w-12 h-12 rounded-full bg-gradient-to-tr ${user.avatarColor || 'from-blue-500 to-cyan-400'} text-white flex items-center justify-center font-bold shadow-sm">
                            ${getInitials(user.displayName)}
                        </div>
                        <span class="w-3.5 h-3.5 bg-emerald-500 border-2 border-white rounded-full absolute bottom-0 right-0"></span>
                    </div>
                    <div class="flex-1 min-w-0">
                        <div class="flex justify-between items-baseline mb-0.5">
                            <h4 class="font-semibold text-gray-900 text-sm truncate">${escapeHtml(user.displayName)}</h4>
                            <span class="text-[10px] text-emerald-600 font-medium">Online</span>
                        </div>
                        <p class="text-xs text-gray-400 truncate">Nhấp để nhắn riêng</p>
                    </div>
                `;

                userEl.addEventListener('click', () => switchChatTarget(user.uid, user));
                dynamicUsersList.appendChild(userEl);
            });
        }

        if (searchInput) searchInput.addEventListener('input', renderUsersList);

        // Switch Chat Channel or User
        function switchChatTarget(targetId, targetUserObj = null) {
            activeChatId = targetId;

            const channelGlobal = document.getElementById('channel-global');
            if (targetId === 'global') {
                channelGlobal.classList.add('bg-blue-50', 'text-blue-600');
                chatHeaderTitle.innerText = "Phòng Chat Chung";
                chatHeaderStatus.innerText = "Kênh nhắn tin công khai";
                chatHeaderAvatar.className = "w-10 h-10 rounded-full bg-gradient-to-tr from-blue-600 to-cyan-400 text-white flex items-center justify-center font-bold shadow";
                chatHeaderAvatar.innerHTML = `<i class="fa-solid fa-users"></i>`;
            } else {
                channelGlobal.classList.remove('bg-blue-50', 'text-blue-600');
                if (targetUserObj) {
                    chatHeaderTitle.innerText = targetUserObj.displayName;
                    chatHeaderStatus.innerText = "Đang hoạt động";
                    chatHeaderAvatar.className = `w-10 h-10 rounded-full bg-gradient-to-tr ${targetUserObj.avatarColor || 'from-blue-500 to-cyan-400'} text-white flex items-center justify-center font-bold shadow`;
                    chatHeaderAvatar.innerText = getInitials(targetUserObj.displayName);
                }
            }

            renderUsersList();

            sidebar.classList.add('hidden', 'md:flex');
            chatArea.classList.remove('hidden');
            chatArea.classList.add('flex');

            renderMessagesFeed();
        }

        document.getElementById('channel-global').addEventListener('click', () => switchChatTarget('global'));

        if (backToListBtn) {
            backToListBtn.addEventListener('click', () => {
                chatArea.classList.add('hidden');
                chatArea.classList.remove('flex');
                sidebar.classList.remove('hidden');
            });
        }

        // Render Messages Feed
        function renderMessagesFeed() {
            messagesContainer.innerHTML = '';

            const filteredMessages = allMessages.filter(msg => {
                if (activeChatId === 'global') {
                    return msg.targetId === 'global' || !msg.targetId;
                } else {
                    return (msg.senderId === myProfile.id && msg.targetId === activeChatId) ||
                           (msg.senderId === activeChatId && msg.targetId === myProfile.id);
                }
            });

            if (filteredMessages.length === 0) {
                messagesContainer.innerHTML = `
                    <div class="h-full flex flex-col items-center justify-center text-center p-6 text-gray-400">
                        <div class="w-16 h-16 bg-gray-200/60 rounded-full flex items-center justify-center text-gray-400 text-2xl mb-3">
                            <i class="fa-regular fa-comments"></i>
                        </div>
                        <p class="font-medium text-sm text-gray-500">Chưa có tin nhắn nào.</p>
                        <p class="text-xs text-gray-400 mt-1">Hãy bắt đầu nhắn tin ngay bây giờ!</p>
                    </div>
                `;
                return;
            }

            filteredMessages.forEach(msg => {
                const isMine = msg.senderId === myProfile.id;
                const messageWrapper = document.createElement('div');
                messageWrapper.className = `flex items-end space-x-2 ${isMine ? 'justify-end' : 'justify-start'} animate-fade-in`;

                const timeStr = msg.timestamp ? new Date(msg.timestamp).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }) : '';

                if (isMine) {
                    messageWrapper.innerHTML = `
                        <div class="flex flex-col items-end max-w-[75%] md:max-w-[65%]">
                            <div class="chat-bubble-sender text-white px-4 py-2.5 rounded-2xl rounded-br-xs shadow-sm text-sm leading-relaxed break-words">
                                ${escapeHtml(msg.text)}
                            </div>
                            <span class="text-[10px] text-gray-400 mt-1 px-1">${timeStr}</span>
                        </div>
                    `;
                } else {
                    messageWrapper.innerHTML = `
                        <div class="w-8 h-8 rounded-full bg-gradient-to-tr ${msg.senderAvatarColor || 'from-gray-400 to-gray-600'} text-white flex items-center justify-center text-xs font-bold shadow-sm flex-shrink-0">
                            ${getInitials(msg.senderName || msg.sender)}
                        </div>
                        <div class="flex flex-col items-start max-w-[75%] md:max-w-[65%]">
                            <span class="text-[11px] font-semibold text-gray-500 mb-0.5 ml-1">${escapeHtml(msg.senderName || msg.sender || 'Thành viên')}</span>
                            <div class="chat-bubble-receiver text-gray-800 px-4 py-2.5 rounded-2xl rounded-bl-xs shadow-sm text-sm leading-relaxed break-words border border-gray-100">
                                ${escapeHtml(msg.text)}
                            </div>
                            <span class="text-[10px] text-gray-400 mt-1 px-1">${timeStr}</span>
                        </div>
                    `;
                }

                messagesContainer.appendChild(messageWrapper);
            });

            messagesContainer.scrollTop = messagesContainer.scrollHeight;
        }

        // Send Message
        messageForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            let text = messageInput.value.trim();
            if (!text) text = "👍";

            messageInput.value = '';
            sendIcon.className = "fa-solid fa-thumbs-up text-lg";
            emojiPicker.classList.add('hidden');

            const msgData = {
                id: 'msg_' + Date.now(),
                senderId: myProfile.id,
                senderName: myProfile.name,
                sender: myProfile.name,
                senderAvatarColor: myProfile.avatarColor,
                targetId: activeChatId,
                text: text,
                timestamp: Date.now()
            };

            // Local immediate append
            allMessages.push(msgData);
            renderMessagesFeed();

            // Firebase push
            if (db) {
                try {
                    const msgCol = collection(db, 'artifacts', appId, 'public', 'data', 'messages');
                    await addDoc(msgCol, {
                        senderId: myProfile.id,
                        senderName: myProfile.name,
                        sender: myProfile.name,
                        senderAvatarColor: myProfile.avatarColor,
                        targetId: activeChatId,
                        text: text,
                        timestamp: Date.now()
                    });
                } catch (err) {
                    console.warn("Gửi tin nhắn local (không kết nối cloud):", err);
                }
            }
        });

        // Input Icon dynamic change
        messageInput.addEventListener('input', () => {
            if (messageInput.value.trim().length > 0) {
                sendIcon.className = "fa-solid fa-paper-plane text-base";
            } else {
                sendIcon.className = "fa-solid fa-thumbs-up text-lg";
            }
        });

        // Toggle Emoji Picker
        toggleEmojiBtn.addEventListener('click', () => {
            emojiPicker.classList.toggle('hidden');
        });

        document.querySelectorAll('.emoji-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                messageInput.value += btn.innerText;
                sendIcon.className = "fa-solid fa-paper-plane text-base";
                emojiPicker.classList.add('hidden');
                messageInput.focus();
            });
        });

        // Logout / Change display name
        logoutBtn.addEventListener('click', () => {
            localStorage.removeItem('msg_user_name');
            localStorage.removeItem('msg_user_color');
            location.reload();
        });

        // Sanitize string
        function escapeHtml(str) {
            if (!str) return '';
            return str.replace(/&/g, "&amp;")
                      .replace(/</g, "&lt;")
                      .replace(/>/g, "&gt;")
                      .replace(/"/g, "&quot;")
                      .replace(/'/g, "&#039;");
        }
    </script>
</body>
</html>
